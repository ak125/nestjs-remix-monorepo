version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    ignore:
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@nestjs/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@remix-run/*"
        update-types: ["version-update:semver-major"]
      # Storybook major (9→10) = migration manuelle planifiée, jamais auto-PR
      # (cf. cas #280 / PR #605 : addon-onboarding@10 émis seul casse storybook@9).
      - dependency-name: "storybook"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@storybook/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@chromatic-com/storybook"
        update-types: ["version-update:semver-major"]
    groups:
      # Ecosystem-coupling groups (déclarés EN PREMIER pour prendre précédence
      # sur le groupe générique dev-dependencies). Dependabot évalue les groupes
      # top-down ; sans cet ordre + sans exclude-patterns ci-dessous, un addon
      # ecosystem version-bumped en minor matchait dev-dependencies en premier
      # et bypassait son groupe ecosystem (cas #280 storybook 9 vs
      # addon-onboarding@10 le 2026-05-04, re-fire sur PR #605 le 2026-05-18).
      #
      # react-router-ecosystem : variante cross-dependency-type du même incident.
      # La famille est scindée entre devDeps (@react-router/dev,
      # @react-router/remix-routes-option-adapter) et deps runtime (react-router,
      # @react-router/express|node|serve), toutes épinglées exactes. Le groupe
      # dev-dependencies (dependency-type: development) n'a pris QUE la moitié dev
      # → peer react-router@^8.3.0 de @react-router/dev@8.3.0 vs react-router@8.0.1
      # runtime → ERESOLVE sur npm ci → 21 checks rouges (PR #1353, 2026-08-14).
      # Donc PAS de dependency-type ici (il faut les deux moitiés) et PAS de
      # update-types (un major scindé rejouerait exactement le même ERESOLVE).
      react-router-ecosystem:
        patterns:
          - "react-router"
          - "@react-router/*"
      storybook-ecosystem:
        patterns:
          - "storybook"
          - "@storybook/*"
          - "@chromatic-com/storybook"
        update-types: ["minor", "patch"]
      tiptap-ecosystem:
        patterns:
          - "@tiptap/*"
        update-types: ["minor", "patch"]
      vite-ecosystem:
        patterns:
          - "vite"
          - "vitest"
          - "@vitejs/*"
          - "@vitest/*"
          - "vite-tsconfig-paths"
        update-types: ["minor", "patch"]
      dev-dependencies:
        dependency-type: "development"
        update-types: ["minor", "patch"]
        exclude-patterns:
          - "react-router"
          - "@react-router/*"
          - "storybook"
          - "@storybook/*"
          - "@chromatic-com/storybook"
          - "@tiptap/*"
          - "vite"
          - "vitest"
          - "@vitejs/*"
          - "@vitest/*"
          - "vite-tsconfig-paths"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
