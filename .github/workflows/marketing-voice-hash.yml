name: marketing-voice-hash

# Copies de la voix de marque dans le monorepo : chacune est déclarée au manifeste
# .spec/00-canon/canon-distribution/canon-hashes.json (clé `marketing_voice`) et
# conforme à sa source du même dossier. Contrôle local, sans réseau :
# scripts/ci/check-marketing-voice-hash.sh appelle
# scripts/canon/compute-canon-hashes.py --check.
# Ni cron ni repository_dispatch, pour la même raison que agent-exit-contract-hash.yml.
# Étape 2 de la sortie du vault
# (docs/audit/mandat-ar-20261116/inventaire-vault-et-plan.md §2).

on:
  push:
    branches: [main]
    paths:
      - ".spec/00-canon/canon-distribution/**"
      - "scripts/canon/compute-canon-hashes.py"
      - ".claude/canon-mirrors/marketing-voice.md"
      - "workspaces/marketing/.claude/canon-mirrors/marketing-voice.md"
      - "scripts/ci/check-marketing-voice-hash.sh"
      - ".github/workflows/marketing-voice-hash.yml"
  pull_request:
    paths:
      - ".spec/00-canon/canon-distribution/**"
      - "scripts/canon/compute-canon-hashes.py"
      - ".claude/canon-mirrors/marketing-voice.md"
      - "workspaces/marketing/.claude/canon-mirrors/marketing-voice.md"
      - "scripts/ci/check-marketing-voice-hash.sh"
      - ".github/workflows/marketing-voice-hash.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        copy:
          - .claude/canon-mirrors/marketing-voice.md
          - workspaces/marketing/.claude/canon-mirrors/marketing-voice.md
    steps:
      - uses: actions/checkout@v7
      - name: Verify ${{ matrix.copy }}
        run: bash scripts/ci/check-marketing-voice-hash.sh "${{ matrix.copy }}"
