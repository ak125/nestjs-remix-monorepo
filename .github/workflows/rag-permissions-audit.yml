name: RAG L3 Permissions Audit

# ADR-046 § Layer L3 RAG MIRROR + ADR-050 enforcement at PR/push time.
#
# Bloque toute PR qui modifie directement rag/knowledge/ sans passer par le
# pipeline canonique L1→L2→L3 (wiki/exports/ → sync-wiki-exports-to-rag.py).
#
# Lance aussi les tests du sync et de son cron horaire, et refuse toute entrée
# ajoutée à la baseline héritée du miroir (audit/baselines/rag-mirror-legacy-
# baseline.json) : elle ne fait que décroître (--tighten-legacy-baseline).
#
# Memory: feedback_canon_rule_live_iff_adr_accepted.md.

on:
  pull_request:
    paths:
      - 'rag/knowledge/**'
      - 'scripts/rag-sync/**'
      - 'scripts/cron/sync-rag-from-wiki*.sh'
      - 'audit/baselines/rag-mirror-legacy-baseline.json'
      - 'scripts/wiki/**'
      - 'scripts/wiki-generators/**'
      - 'scripts/wiki-exports/**'
      - 'scripts/raw-downloaders/**'
      - 'sgconfig.yml'
      - '.ast-grep/rules/no-direct-rag-knowledge-write.yml'
      - '.github/workflows/rag-permissions-audit.yml'
  push:
    branches:
      - main
      - dev
    paths:
      - 'rag/knowledge/**'
      - 'scripts/rag-sync/**'
      - 'scripts/cron/sync-rag-from-wiki*.sh'
      - 'audit/baselines/rag-mirror-legacy-baseline.json'
      - 'scripts/wiki/**'
      - 'scripts/wiki-generators/**'
      - 'scripts/wiki-exports/**'
      - 'scripts/raw-downloaders/**'
      - 'sgconfig.yml'
      - '.ast-grep/rules/no-direct-rag-knowledge-write.yml'
      - '.github/workflows/rag-permissions-audit.yml'

# Minimum scope: PR diff inspection + checkout (ADR-043 Sprint 1 ticket #7).
permissions:
  contents: read

jobs:
  rag-direct-write-guard:
    name: rag/knowledge direct modification guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history for diff against base

      - name: Detect direct modifications under rag/knowledge/
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi
          HEAD_SHA="${{ github.sha }}"

          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "ℹ️  No base commit (initial push or branch creation) — skipping rag/knowledge diff."
            exit 0
          fi

          CHANGED=$(git diff --name-only "$BASE_SHA..$HEAD_SHA" -- 'rag/knowledge/' || true)
          if [ -n "$CHANGED" ]; then
            echo "❌ Direct modification of rag/knowledge/ detected — refused per ADR-046/050."
            echo ""
            echo "Files modified:"
            echo "$CHANGED" | sed 's/^/  /'
            echo ""
            echo "rag/knowledge/ est un MIRROR L3 read-only. Toute écriture doit passer"
            echo "par automecanik-wiki/exports/rag/ + sync-wiki-exports-to-rag.py."
            exit 1
          fi
          echo "✓ Aucune modification directe rag/knowledge/ détectée."

  rag-sync-tests:
    name: rag-sync tests + legacy baseline ratchet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # base baseline read from git history

      - name: Unit tests (sync-wiki-exports-to-rag.py)
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover \
            -s scripts/rag-sync -p 'test_sync_wiki_exports_to_rag.py' -v

      - name: Hourly cron test (disposable repos)
        run: bash scripts/cron/sync-rag-from-wiki.test.sh

      # Base absente de l'historique = échec, jamais « rien à comparer » : la garde
      # ne doit pas devenir vacante sur un fetch incomplet (.claude/rules/guardrails.md).
      - name: Legacy baseline only shrinks
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          BASELINE=audit/baselines/rag-mirror-legacy-baseline.json
          if [ "$EVENT_NAME" = "pull_request" ]; then BASE_SHA="$PR_BASE_SHA"; else BASE_SHA="$PUSH_BEFORE_SHA"; fi
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "ℹ️  No base commit (initial push or branch creation) — nothing to compare."
            exit 0
          fi
          git cat-file -e "$BASE_SHA^{commit}" || { echo "❌ base $BASE_SHA absent from history"; exit 1; }
          if ! git cat-file -e "$BASE_SHA:$BASELINE" 2>/dev/null; then
            echo "ℹ️  Baseline introduced by this change — nothing to compare."
            exit 0
          fi
          ADDED=$(LC_ALL=C comm -13 \
            <(git show "$BASE_SHA:$BASELINE" | jq -r '.files[]' | LC_ALL=C sort) \
            <(jq -r '.files[]' "$BASELINE" | LC_ALL=C sort))
          if [ -n "$ADDED" ]; then
            echo "❌ Legacy baseline grew: $(printf '%s\n' "$ADDED" | wc -l) entry(ies) added. It only shrinks (--tighten-legacy-baseline)."
            printf '%s\n' "$ADDED" | head -20 | sed 's/^/  /'
            exit 1
          fi
          echo "✓ Legacy baseline: no entry added ($(jq '.files | length' "$BASELINE") entries)."

  ast-grep-rag-write:
    name: ast-grep no-direct-rag-knowledge-write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run ast-grep rule
        run: |
          npx --yes --package @ast-grep/cli@0.42.1 ast-grep scan \
            --config sgconfig.yml \
            --rule .ast-grep/rules/no-direct-rag-knowledge-write.yml || {
            code=$?
            # ast-grep returns 10 for warnings, non-zero for errors. Severity:error blocks here.
            if [ "$code" != "0" ] && [ "$code" != "10" ]; then
              echo "❌ ast-grep no-direct-rag-knowledge-write violations detected."
              exit "$code"
            fi
          }
          echo "✓ ast-grep no-direct-rag-knowledge-write : 0 violation."
