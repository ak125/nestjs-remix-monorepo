name: Registry freshness (ADR-058 PR-E, Phase 1 warn-only)

# Phase 1 freshness gate per ADR-058 §Acceptance V1 :
#   - warning-only (continue-on-error: true)
#   - verifies Layer 1 + Layer 2 → Layer 3 canonical projection is reproducible
#   - confirms 4 V1 invariants pass on the canonical
#
# When PR-G ships (Phase 2 block-new), a sibling workflow
# `registry-new-file-gate.yml` will block new files lacking owner/domain.
# This freshness check stays warn-only until V2 block-all.

on:
  pull_request:
    branches: [main]
    paths:
      # --- Builder + overlay : la CONFIG du registre ---
      - "scripts/registry/**"
      - "scripts/audit/build-deep-inventory.js"
      - "scripts/audit/build-db-usage-map.js"
      - "packages/registry/**"
      - "audit/registry/**"
      - ".spec/00-canon/repository-registry/**"
      - "backend/supabase/migrations/**"
      - ".github/workflows/registry-fresh.yml"
      - "package.json"
      # --- Arbres INDEXÉS par files.json (2728 entrées) ---
      # Sans eux, une PR qui ajoute/supprime 50 fichiers TS ne déclenchait jamais
      # le gate de fraîcheur du registre qui les recense. C'est la cause directe
      # de la dérive de 164 commits constatée le 2026-08-13 (canonical buildé au
      # 217d47912 / 2026-06-23 alors que HEAD était à 172f07c24 / 2026-08-09).
      - "backend/src/**"
      - "frontend/app/**"
      - "packages/**"
  push:
    branches: [main]
    paths:
      - "scripts/registry/**"
      - "packages/**"
      - ".spec/00-canon/repository-registry/**"
      - "backend/src/**"
      - "frontend/app/**"

jobs:
  registry-fresh:
    name: Registry freshness (warn-only, Phase 1)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    continue-on-error: true # Phase 1 = warning-only per ADR-058 §Acceptance V1
    # ⚠️ Chaque garde porte `if: ${{ !cancelled() }}` — NE PAS RETIRER.
    #
    # `continue-on-error` agit au niveau du JOB : il empêche le job de bloquer la
    # PR. Il n'empêche PAS un step en échec d'interrompre la séquence. Sans
    # condition explicite, le premier step rouge fait passer TOUS les suivants en
    # `skipped`, et le job est malgré tout rapporté `success` — un vert qui ne
    # prouve rien.
    #
    # Constaté le 2026-08-13 sur `main` (run 31741521477, commit 8a62ee5d2) : I6
    # échouait sur une dérive réelle de `canonical.json` (3 inputHashes divergents),
    # et les 8 steps suivants — deep-inventory freshness, overlay L2, invariants
    # I1..I5, déterminisme, freshness diff, RPC parser — étaient tous `skipped`.
    # Le workflow ne validait donc plus RIEN depuis cet échec, tout en affichant
    # un run vert. C'est le même schéma que I6 vacant, un cran plus haut : une
    # garde correcte que l'ordonnancement empêche de parler.
    #
    # Avec `!cancelled()`, chaque garde s'exécute et rend son verdict
    # indépendamment des précédentes ; un échec reste visible step par step.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install
        run: npm ci

      # ⚠️ CE STEP DOIT RESTER AVANT TOUT REBUILD — c'est le seul endroit où I6
      # peut dire quelque chose.
      #
      # I6 (`checkCanonicalFresh`, scripts/registry/validate-invariants.ts)
      # compare `canonical.meta.inputHashes` aux sha256 réels des sources. Il est
      # complet, `severity: error`, et sort 1. Mais il n'était invoqué qu'APRÈS
      # le step « Build Layer 1 + Layer 3 canonical » : à ce moment-là canonical
      # vient d'être régénéré depuis les sources courantes, donc ses inputHashes
      # correspondent forcément. **I6 était vacant par construction de l'ordre
      # des steps** — pas cassé, jamais consulté sur l'état commité.
      #
      # Constaté le 2026-08-13 : canonical.json commité affichait 3 inputHashes
      # divergents sur 10 (automation-reality.yaml, ownership.yaml, deps.json)
      # sans qu'aucun gate ne le signale, pour une dérive de 164 commits.
      #
      # Le step post-rebuild plus bas reste utile pour I1..I5 (structure du
      # canonical reconstruit) — mais il ne prouve RIEN sur la fraîcheur.
      - name: I6 — freshness of the COMMITTED canonical (must precede any rebuild)
        if: ${{ !cancelled() }}
        run: npm run registry:validate-invariants

      # Les 19 tests de la garde PR-8 existaient mais n'étaient lancés par AUCUN
      # script npm, AUCUN workflow et AUCUN hook (0 occurrence au 2026-08-13).
      # Ils encodent des décisions de conception (C8 snapshot-only, parité
      # NEVER_AUTO_DELETE bash↔TS, tolérance target-scoped, indépendance à la
      # locale) — non exécutés, ils ne protègent rien. Ils tournent avant le check
      # ci-dessous : un générateur cassé doit se voir sur ses fixtures, pas sur
      # l'inventaire réel.
      - name: PR-8 cleanup guard — unit tests (fixtures)
        if: ${{ !cancelled() }}
        run: npm run audit:cleanup-candidates:test

      # ⚠️ CE STEP DOIT RESTER AVANT `audit:inventory` ET AVANT `npm run registry`.
      #
      # Il compare l'inventaire PR-8 COMMITÉ aux inputs COMMITÉS. Placé après les
      # rebuilds, il comparerait au code fraîchement régénéré et remonterait une
      # dérive PR-8 *causée par* une dérive amont — les deux signaux conflatés,
      # exactement ce que le périmètre du step « Deep-inventory freshness »
      # interdit. Ici les deux restent lisibles séparément :
      #   - ce step            → l'inventaire PR-8 est-il cohérent avec son snapshot d'inputs ?
      #   - Deep-inventory     → ce snapshot d'inputs reflète-t-il le code réel ?
      #
      # POURQUOI CE STEP N'EXISTAIT PAS : le mode global `--check` comparait
      # l'artefact octet près, `meta.toolchain` inclus. L'artefact commité porte
      # `linux / v20.19.6`, ce runner est `ubuntu / node 24` → le step aurait été
      # rouge en permanence, pour une raison purement déclarative. Le générateur
      # trie désormais par codepoint (plus de dépendance à la locale ICU) et
      # `comparablePayload` exclut `meta.toolchain` de la comparaison tout en le
      # conservant dans l'artefact. L'inventaire est donc reproductible depuis
      # n'importe quelle machine, et cette garde enfin câblable.
      #
      # `audit-reports/` est gitignoré : `contract-health.json` est absent ici
      # comme au checkout local → `contractHealth: null` des deux côtés. Ne pas
      # ajouter `npm run audit:drift-dashboard` avant ce step, cela rendrait
      # l'artefact CI incomparable à l'artefact commité.
      #
      # PROMOTION : non-bloquant via le `continue-on-error` du job (Phase 1).
      # Le retirer en même temps que celui du step Deep-inventory.
      - name: PR-8 inventory freshness (committed inventory vs committed inputs)
        if: ${{ !cancelled() }}
        run: npm run audit:cleanup-candidates:check

      # ⚠️ DOIT RESTER AVANT `audit:inventory` — c'est un test de PROJECTION : il
      # inspecte les 7 artefacts COMMITÉS. Placé après le rebuild, il validerait
      # ce que le générateur vient d'écrire, donc trivialement conforme : vacant
      # par construction de l'ordre des steps, exactement comme I6 l'était.
      #
      # Il couvre deux régressions que « Deep-inventory freshness » ne peut PAS
      # voir, parce que celui-ci compare commité vs régénéré sur LA MÊME machine :
      #   - un tri `localeCompare()` (ordre dépendant de l'ICU du process) — les
      #     deux côtés seraient triés pareil, donc vert ;
      #   - un artefact régénéré depuis un working tree sale (fichiers non commités
      #     capturés par knip/dependency-cruiser, qui scannent le FS et pas l'index
      #     git) — les deux côtés captureraient la même saleté, donc vert.
      # Constaté le 2026-08-13 : 2 fichiers untracked s'étaient glissés dans
      # dead-code-candidates.json, et donc dans le fingerprint PR-8 en aval.
      - name: Deep-inventory determinism (committed projections, cross-machine)
        if: ${{ !cancelled() }}
        run: npm run audit:inventory:test

      - name: Run upstream audit producers
        if: ${{ !cancelled() }}
        run: npm run audit:inventory

      # `audit:inventory:check` existait dans package.json mais n'était appelé
      # par AUCUN workflow ni hook (0 occurrence). Résultat : les 7 projections
      # deep-inventory (dont dead-code-candidates.json, l'input du ratchet
      # d'orphelins) étaient figées au 217d47912 / 2026-06-23 sans que rien ne
      # le signale. On le câble ici — même workflow, même nature de signal
      # (fraîcheur d'une projection générée), et les `paths:` corrigés ci-dessus
      # font qu'il se déclenche enfin sur les arbres qu'il indexe.
      #
      # PÉRIMÈTRE : `audit/*.json` uniquement — c'est exactement ce que
      # build-deep-inventory.js + build-db-usage-map.js écrivent (AUDIT_DIR).
      # NE PAS étendre à `audit/registry/*.json` : ces fichiers sont produits par
      # les builders `registry:build:*`, pas par `audit:inventory`. Le gate
      # rapporterait « deep inventory périmé » pour une dérive du registre —
      # deux signaux distincts conflatés. La fraîcheur de `audit/registry/**` est
      # couverte par le step « Freshness diff » plus bas + le finding
      # `canonical_stale` (build-drift-dashboard.ts, inputHashes).
      #
      # ⚠️ LISTE EXPLICITE, PAS DE GLOB — 7 attendus = 7 contrôlés.
      #
      # Historique de ce choix, en deux temps :
      #   1. `audit/*.json` SANS magic pathspec sélectionnait 296 fichiers : en
      #      pathspec git, `*` matche aussi `/` (wildmatch sans WM_PATHNAME). Le
      #      gate couvrait donc `audit/registry/*.json` — que le paragraphe
      #      ci-dessus interdit explicitement — plus les 5 ratchets
      #      `audit/baselines/**`, `audit/cleanup/pr-8-*.json` et les ~280
      #      `audit/content/raw-evidence/**`.
      #   2. `:(glob)audit/*.json` ramenait à 12, mais 5 d'entre eux sont des
      #      snapshots one-off que `audit:inventory` ne produit PAS
      #      (`compatibility-*`, `pilot-*.verdict.json`, `seo-v9-inventaire-*` —
      #      ce dernier explicitement documenté comme tel dans audit/README.md).
      #
      # Dans les deux cas le périmètre DÉCLARÉ n'était pas le périmètre APPLIQUÉ.
      # La liste ci-dessous est exactement ce que `build-deep-inventory.js` (6) et
      # `build-db-usage-map.js` (1) écrivent sous AUDIT_DIR. Un 8e artefact
      # contractuel devra être ajouté ICI, intentionnellement et visiblement
      # dans le diff — jamais capté par élargissement silencieux d'un motif.
      #
      # PROMOTION : `continue-on-error` au niveau du job le rend non-bloquant
      # aujourd'hui. Le retirer quand les 7 artefacts sont régénérés et stables.
      - name: Deep-inventory freshness (les 7 artefacts contractuels)
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          ARTEFACTS="
            audit/runtime-entrypoints.json
            audit/module-boundaries.json
            audit/dynamic-import-edges.json
            audit/cycle-map.json
            audit/duplicate-map.json
            audit/dead-code-candidates.json
            audit/db-usage-map.json
          "
          # Fail-closed : un artefact contractuel disparu est une dérive, pas un no-op.
          for f in $ARTEFACTS; do
            [ -f "$f" ] || { echo "::error::artefact contractuel absent : $f"; exit 1; }
          done
          git diff --stat -- $ARTEFACTS || true
          if ! git diff --exit-code --quiet -- $ARTEFACTS; then
            echo "::error::deep-inventory drifted vs sources — run \`npm run audit:inventory\` and commit the 7 projections"
            exit 1
          fi
          echo "✓ deep-inventory projections in sync (7/7)"

      - name: Build Layer 1 + Layer 3 canonical
        if: ${{ !cancelled() }}
        run: npm run registry

      - name: Validate overlay (Layer 2)
        if: ${{ !cancelled() }}
        run: npm run registry:validate

      # Structure du canonical RECONSTRUIT (I1..I5). I6 est vacant ici par
      # construction — le rebuild vient de réaligner les inputHashes. La preuve
      # de fraîcheur est le step « I6 — freshness of the COMMITTED canonical »
      # exécuté avant le rebuild. Ne pas déplacer ce step vers le haut ni
      # supprimer celui du haut : ils ne testent pas la même chose.
      - name: Validate rebuilt canonical invariants (I1..I5 structural)
        if: ${{ !cancelled() }}
        run: npm run registry:validate-invariants

      - name: Determinism check (V1-2 — canonical hash stable across 2 runs)
        if: ${{ !cancelled() }}
        # Phase 1 warn-only : never exit 1 ; surface drift as GitHub annotation only.
        # Promotion to ERROR happens in V1.5 (signal-proven 14j of clean determinism).
        run: |
          sha256sum audit/registry/canonical.json > /tmp/c1.txt
          npm run registry --silent
          sha256sum audit/registry/canonical.json > /tmp/c2.txt
          if ! diff -q /tmp/c1.txt /tmp/c2.txt; then
            echo "::warning::canonical.json not deterministic across 2 runs"
            diff /tmp/c1.txt /tmp/c2.txt || true
          else
            echo "✓ canonical.json deterministic"
          fi

      - name: Freshness diff (canonical.json committed = canonical.json rebuilt)
        if: ${{ !cancelled() }}
        # Le step SORT EN ERREUR sur dérive. Le job reste non-bloquant via le
        # `continue-on-error: true` du job (Phase 1) — mais le signal est désormais
        # RÉEL : un job rouge non-bloquant, pas une annotation noyée.
        #
        # POURQUOI ce changement : l'ancien `if git diff --exit-code …; then … else
        # echo "::warning::" ; fi` neutralisait `--exit-code` par construction.
        # Le step sortait 0 même en dérive, y compris si `continue-on-error` était
        # retiré. Deux défenses empilées contre le blocage, dont une invisible.
        #
        # PROMOTION : retirer `continue-on-error` du job après N runs verts
        # consécutifs, avec le décompte inscrit ici (modèle audit.yml §Trigger
        # satisfied). Ne pas promouvoir sur une intuition.
        run: |
          git diff --stat audit/registry/canonical.json || true
          if ! git diff --exit-code --quiet audit/registry/canonical.json; then
            echo "::error::audit/registry/canonical.json drifted vs Layer 1+2 sources — run \`npm run registry\` and commit the projection"
            exit 1
          fi
          echo "✓ canonical.json in sync with sources"

      - name: Run RPC parser fixture tests
        if: ${{ !cancelled() }}
        run: npm run registry:test:rpc-parser

      - name: Summary
        if: always()
        run: |
          {
            echo "## Registry freshness — Phase 1 (warn-only)";
            echo "";
            if [ -f audit/registry/canonical.json ]; then
              count_files=$(jq '.files | length' < audit/registry/canonical.json);
              count_tables=$(jq '.db.tables | length' < audit/registry/canonical.json);
              count_rpc=$(jq '.db.rpc | length' < audit/registry/canonical.json);
              count_deps=$(jq '.deps | length' < audit/registry/canonical.json);
              count_runtime=$(jq '.runtime | length' < audit/registry/canonical.json);
              sot_fp=$(jq -r '.meta.sotFingerprint' < audit/registry/canonical.json);
              echo "- **files**: ${count_files}";
              echo "- **db.tables**: ${count_tables}";
              echo "- **db.rpc**: ${count_rpc}";
              echo "- **deps**: ${count_deps}";
              echo "- **runtime**: ${count_runtime}";
              echo "- **sotFingerprint**: \`${sot_fp}\`";
            else
              echo "- ❌ canonical.json missing";
            fi
          } >> "$GITHUB_STEP_SUMMARY"
