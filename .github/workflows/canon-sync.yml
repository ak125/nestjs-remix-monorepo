name: canon-sync

# Generic auto-PR resync of canon mirrors from ak125/governance-vault.
#
# Triggers:
# - repository_dispatch[canon-updated]: fired by vault's canon-publish.yml
#   on every push to main that touches a canon file or canon-hashes.json.
# - schedule (daily 03:00 UTC): defense-in-depth catch-up if dispatch was
#   missed (token expired, transient failure). Runs 30min before the per-canon
#   *-hash.yml verification workflows so any drift is auto-fixed before they
#   run.
# - workflow_dispatch: manual re-run.
#
# Flow:
# 1. scripts/ci/sync-canon-from-vault.sh fetches the vault's canon-hashes.json,
#    iterates over every canon entry whose `consumers[].repo` is this repo,
#    fetches the raw canon file, applies the canonical strip-frontmatter
#    transform, verifies sha256 against `distribution_sha256` (fail-closed),
#    and writes each declared mirror path.
# 2. scripts/ci/canon-sync-pr.mjs prepare compares the result with the open
#    auto-PR. Same content: the action is skipped, so head and body stay as
#    reviewed. A PR left behind main is refreshed by a human decision.
#    Different content: it renders the body, moving the evidence recorded for
#    the outgoing head to a stale archive that no longer certifies anything.
# 3. Otherwise peter-evans/create-pull-request@v8 opens (or updates) a PR with
#    the resync, in a commit signed through the API. Its DoD boxes stay unticked.
# 4. scripts/ci/canon-sync-pr.mjs verify fails the job unless the operation
#    happened as announced, on a head GitHub verifies, with the assignee set.
# 5. The PR's own CI (marketing-voice-hash.yml, agent-exit-contract-hash.yml)
#    verifies the bytes match the vault on every push to the mirror paths.
#
# Generic-by-design: adding a new canon to the vault's CANONS registry
# (see governance-vault/_scripts/compute-canon-hashes.py) requires ZERO
# changes in this monorepo. The script auto-discovers consumers from
# canon-hashes.json.

on:
  repository_dispatch:
    types: [canon-updated]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: canon-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      CANON_SYNC_ASSIGNEE: ak125
    steps:
      - uses: actions/checkout@v7

      - name: Sync canon mirrors from vault
        run: bash scripts/ci/sync-canon-from-vault.sh

      - name: Compare with the open auto-PR and render its body
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/ci/canon-sync-pr.mjs prepare

      - name: Open (or update) auto-PR if mirrors changed
        id: cpr
        if: steps.prepare.outputs.skip == 'false'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: canon-sync/auto
          commit-message: "chore(canon): resync mirrors from governance-vault"
          title: "chore(canon): resync mirrors from governance-vault"
          body-path: ${{ steps.prepare.outputs.body_path }}
          sign-commits: true
          assignees: ${{ env.CANON_SYNC_ASSIGNEE }}
          delete-branch: true
          labels: |
            canon-sync
            automated

      - name: Verify the action's post-conditions
        if: steps.prepare.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_OPERATIONS: ${{ steps.prepare.outputs.expected }}
          PREVIOUS_HEAD: ${{ steps.prepare.outputs.previous_head }}
          CPR_OPERATION: ${{ steps.cpr.outputs.pull-request-operation }}
          CPR_HEAD_SHA: ${{ steps.cpr.outputs.pull-request-head-sha }}
          CPR_VERIFIED: ${{ steps.cpr.outputs.pull-request-commits-verified }}
          CPR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
        run: node scripts/ci/canon-sync-pr.mjs verify
