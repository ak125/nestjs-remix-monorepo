services:
  monorepo_preprod:
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis_preprod:6379
      - REDIS_HOST=redis_preprod
      - REDIS_PORT=6379
      - NODE_ENV=production
      - APP_ENV=preprod
      # No direct DB credentials or outbound route from the application.
      - DATABASE_URL=
      - SUPABASE_SERVICE_ROLE_KEY=
      - SUPABASE_URL=http://readonly_preprod:3000
      - SUPABASE_ANON_KEY=preprod-isolated-gateway-only
      - READ_ONLY=true
      # SESSION_SECRET : required by main.ts:102 fail-fast (PR #339, NODE_ENV=production
      # >= 32 chars non-placeholder). Injected via secrets.PREPROD_SESSION_SECRET → .env
      # heredoc in ci.yml deploy job → loaded by env_file + shell `. .env`.
      - SESSION_SECRET
      - USE_UNIFIED_RPC=true
      # 🛡️ RPC Safety Gate - ENFORCE P1 (2026-02-03)
      - RPC_GATE_MODE=enforce
      - RPC_GATE_ENFORCE_LEVEL=P1
      # 🚨 Sentry — values inherited from `sops exec-env secrets/sentry.dev.sops.env`
      # wrapping the deploy command. See docs/runbooks/sentry-vps-setup.md.
      # Variable name only (no `=value`) means "inherit from host process env".
      - SENTRY_DSN
      - VITE_SENTRY_DSN
      - SENTRY_ENVIRONMENT
      - SENTRY_TRACES_SAMPLE_RATE
      - SENTRY_RELEASE
      - SENTRY_SEND_PII
      - SENTRY_ALLOW_DEBUG_ENDPOINT
      # 🎯 CrUX API — ADR-063 (Accepted 2026-05-14) — CWV field monitoring
      # Variable name only = inherit from host env (loaded via env_file: .env).
      # Backend-only secret, jamais exposé frontend.
      - CRUX_API_KEY

    container_name: nestjs-remix-monorepo-preprod
    image: massdoc/nestjs-remix-monorepo:preprod
    restart: always
    mem_limit: 3g
    cpus: 2
    depends_on:
      readonly_preprod:
        condition: service_healthy
    # Ingress is owned by the dedicated PREPROD proxy below. Images never
    # enter the SSR catch-all bucket shared by pages, .data and __manifest.
    volumes:
      # Sitemap output directory — writable, isolated from PROD's /var/www/sitemaps.
      # The path follows the canonical `/dev/volumes/nestjs-remix/preprod/*` pattern
      # used by `redis_preprod.sessions`. Without this mount, the backend crashed
      # with ENOENT on first POST /api/sitemap/v10/generate-all in preprod
      # (discovered 2026-05-14 post PR #487 deploy). PROD uses /var/www/sitemaps;
      # preprod is isolated so a faulty regen here cannot corrupt PROD's served files.
      - /dev/volumes/nestjs-remix/preprod/sitemaps/:/var/www/sitemaps:rw
      - /dev/volumes/nestjs-remix/preprod/crawl-hubs/:/var/www/crawl-hubs:rw
    networks:
      - preprod-readonly
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Generate Caddyfile.preprod and imgproxy.preprod.env with
  # node scripts/ci/build-preprod-image-proxy.mjs <compose-directory> first.
  caddy_preprod:
    image: caddy:2.11-alpine
    container_name: caddy-preprod
    restart: unless-stopped
    ports:
      - "127.0.0.1:3200:3000"
    volumes:
      - ./Caddyfile.preprod:/etc/caddy/Caddyfile:ro
    read_only: true
    tmpfs:
      - /data:size=8m
      - /config:size=8m
    mem_limit: 256m
    cpus: 0.5
    depends_on:
      - monorepo_preprod
      - imgproxy_preprod
    networks:
      - preprod-readonly
      - automecanik-preprod

  imgproxy_preprod:
    image: ghcr.io/imgproxy/imgproxy:v4.0.14@sha256:595fb82df2364e35711e4303c6de6ad412bbd93963db47be58354a4d52dd1f17
    container_name: imgproxy-preprod
    env_file:
      - imgproxy.preprod.env
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1
    healthcheck:
      test: ["CMD", "imgproxy", "health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      automecanik-preprod:
        aliases:
          - imgproxy

  # Only this process holds the upstream key. Every upstream request uses a
  # PostgREST GET/HEAD read-only transaction; it never forwards a write method.
  readonly_preprod:
    image: massdoc/nestjs-remix-monorepo:preprod
    container_name: readonly-preprod
    entrypoint: ["node", "/run/preprod-readonly/gateway.cjs"]
    user: "1001:1001"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.5
    volumes:
      - ./preprod-readonly-gateway.cjs:/run/preprod-readonly/gateway.cjs:ro
      - ./readonly-upstream.json:/run/preprod-readonly/upstream.json:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/__audit"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - preprod-readonly
      - automecanik-preprod

  redis_preprod:
    image: redis:7.4.11-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    container_name: redis-preprod
    restart: always
    command: >
      redis-server
      --appendonly yes
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
    volumes:
      # /dev is volatile on the runner host; migrate existing data before rollout.
      - type: bind
        source: /home/deploy/preprod/data/redis
        target: /data
        bind:
          # Fail instead of creating an empty Redis directory before migration.
          create_host_path: false
    networks:
      - preprod-readonly

networks:
  preprod-readonly:
    internal: true
  automecanik-preprod:
    driver: bridge
