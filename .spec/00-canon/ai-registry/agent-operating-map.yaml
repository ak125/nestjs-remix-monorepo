# Allowlist of capabilities that resolve to neither a registry skill nor a node
# yet (modules/engines/services/signals). Keeps department.capabilities from being
# ghost slugs; `owner` is the department id. Each commented with its real path.
# Éléments du dépôt rattachés à aucune fonction, avec leur motif (complément BX-2).
# Le validateur (--contracts) les retire du rapport de couverture.
function_coverage_unassigned:
  - { module: "maintenance", reason: "importé par aucun module (aucun import trouvé le 2026-11-18) : code mort à retirer ou à rebrancher, décision owner" }
  - { module: "agentic-engine", reason: "archivé le 2026-04-02 et commenté dans app.module.ts (ligne 194)" }
  - { routes: "_assets", reason: "répertoire d'images sous frontend/app/routes, pas une route servie" }

declared_capabilities:
  # `evidence` (optional, additive in this PR) carries the real backing — scripts/paths
  # (existsSync-checked by the snapshot generator → BROKEN if absent), tables, runtime
  # branch, or ADR. A `live` capability with ≥1 evidence path is CERTIFIED; without
  # structured evidence it degrades to PARTIAL (pessimism, never faked green). Partial
  # skill-type caps resolve via skills.registry and intentionally omit a path here.
  - { id: suppliers-service,  type: service, owner: supplier, status: live,    evidence: { scripts: [backend/src/modules/suppliers/suppliers.service.ts] } }
