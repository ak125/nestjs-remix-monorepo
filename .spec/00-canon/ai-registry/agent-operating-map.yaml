  rapport:
    regle: "Un rapport unique : issue GitHub mise à jour chaque jour à 7 h (heure de Paris), une ligne par département, « Gestes attendus de l'owner » en tête. Mail court seulement s'il y a un geste. Urgence : mail immédiat, une fois par incident."
    decisions: [7, 67]
  entree_kpi:
    regle: "Un KPI entre au rapport seulement avec sa fiche de fiabilité : définition, source, recoupement, limites, confiance."
    decisions: [8]
  seuil_franchi:
    regle: "Un seuil franchi ouvre une issue dept:NN avec le constat, des chiffres qualifiés et un mandat prêt, sans doublon."
    decisions: [9]
  donnee_absente:
    regle: "Quand la donnée manque, la ligne affiche « pas de mesure »."
    decisions: [24]
  sources:
    regle: "Principale : nos événements marqués humain/robot. Google : Search Console. GA4 en recoupement ; un écart de plus de 20 % est signalé. Fraîcheur affichée au rapport ; alerte au-delà de 3 jours."
    decisions: [36, 68]

