# Règles de conservation des tables de la base massdoc (mandat CA, étape 1, 2026-11-18).
#
# STATUT : PARTIELLEMENT DÉCIDÉ (2026-11-18). Marwane a retenu les durées des six
# familles copie_ponctuelle, journal, import_staging, cache_projection, ancien_site et
# referentiel_metier (statut « décidé »). La famille partition_instantane et toute la
# section partitions restent « proposé » : durée table par table, plus tard.
# Une règle passe à « décidé » seulement avec decided_by, decided_on et decision_ref.
# Ce fichier ne change aucun cron, aucune rétention en service, aucune table :
# appliquer une durée décidée demande un mandat suivant (cron ou migration).
#
# Contrôle : node scripts/governance/validate-db-retention.js (et --self-test).
# Inventaire mesuré : audit/massdoc-table-inventory-2026-11-18.json (L0, daté).
schema_version: 1
title: Règles de conservation des tables de massdoc
database: massdoc (Supabase cxpojprgwgubzjyqzmoq, schéma public)
owner_departments: ["22 data", "21 runtime"]
inventory: audit/massdoc-table-inventory-2026-11-18.json
status: partiellement décidé
decided_by: Marwane
decided_on: "2026-11-18"
decision_ref: >-
  Décision 84 (« règles de conservation par famille en configuration (ex. copie ponctuelle
  30 jours, partitions d'instantanés 90 jours) »), précisée le 2026-11-18 : « Oui » de Marwane
  à « Est-ce que je retiens ces durées, proposées par la session ? », en gardant 90 jours pour
  les copies. Décidé pour six familles ; partition_instantane et les partitions ne sont pas
  décidées (durée table par table plus tard).

# Ce qui sort de la base va dans _archive (ALTER TABLE … SET SCHEMA), jamais un DROP
# sans décision écrite. Chaque lot passe par la migration manuelle, essai à blanc d'abord.
archive_target_schema: _archive

protected:
  - pattern: "^pieces_media_img"
    reason: >-
      Zone interdite : images du catalogue et sauvegardes datées de l'incident de 2026.
      Jamais candidate à l'archivage, quelle que soit sa classe.

families:
  - id: copie_ponctuelle
    label: Copie datée ou sauvegarde ponctuelle
    match: nom daté (_AAAAMMJJ), backup, _old, _copy, _snapshot_<date>
    proposed_retention_days: 90
    after_retention: archiver
    rule: >-
      Une copie faite pour un chantier se garde 90 jours après sa date, puis passe dans _archive.
      Les tables protégées restent en place.
    status: décidé
    decided_by: Marwane
    decided_on: "2026-11-18"
    decision_ref: &decision_84_20261118 >-
      Décision 84 (« règles de conservation par famille en configuration (ex. copie ponctuelle
      30 jours, partitions d'instantanés 90 jours) »), précisée le 2026-11-18 : « Oui » de Marwane
      à « Est-ce que je retiens ces durées, proposées par la session ? », en gardant 90 jours pour
      les copies (et non les 30 jours donnés en exemple par la décision 84).

  - id: partition_instantane
    label: Table partitionnée par date (instantanés, séries)
    match: table partitionnée (relkind p)
    proposed_retention_days: null
    after_retention: supprimer_tranche
    rule: >-
      La durée se règle table par table, dans la section partitions ci-dessous.
      Une tranche supprimée par la rotation est perdue : la durée doit être fixée avant
      d'ajouter une suppression là où il n'y en a pas.
    status: proposé
    decided_by: null
    decided_on: null

  - id: journal
    label: Journal, historique, file ou trace d'exécution
    match: suffixe _log(s), _history, _events, _runs, _audit, _ledger, _queue, _alerts…
    proposed_retention_days: 90
    after_retention: purger_lignes
    rule: >-
      Les lignes de plus de 90 jours sont purgées par un cron, comme __error_logs (30 j, cron#11)
      et __soft_404_events (90 j, cron#31). Un journal jamais écrit et sans lecteur suit la règle
      des tables mortes.
    status: décidé
    decided_by: Marwane
    decided_on: "2026-11-18"
    decision_ref: *decision_84_20261118

  - id: import_staging
    label: Import, préparation, correspondance d'identifiants
    match: stg_, norm_, xref_, decision_, natural_key_, __import_, import_batch, __quarantine_…
    proposed_retention_days: 30
    after_retention: purger_lignes
    rule: >-
      Les lignes d'un lot d'import terminé se gardent 30 jours, puis sont purgées.
      Une table d'import sans lot depuis 90 jours est à trancher.
    status: décidé
    decided_by: Marwane
    decided_on: "2026-11-18"
    decision_ref: *decision_84_20261118

  - id: cache_projection
    label: Cache, agrégat ou projection recalculable
    match: suffixe _cache, _mv, _agg, _stats, _scores, _daily, _metrics, _baseline ; __sitemap*
    proposed_retention_days: null
    after_retention: aucune
    rule: >-
      Recalculable depuis sa source : pas de durée. Une projection qui n'est plus recalculée
      depuis 90 jours est à trancher.
    status: décidé
    decided_by: Marwane
    decided_on: "2026-11-18"
    decision_ref: *decision_84_20261118

  - id: ancien_site
    label: Tables de l'ancien site (préfixe ___)
    match: préfixe ___
    proposed_retention_days: null
    after_retention: aucune
    rule: >-
      Commandes, factures, clients et configuration de l'ancien site : obligations légales
      et comptables possibles. Aucune durée ni archivage sans avis du département 18 (legal)
      et 17 (finance).
    status: décidé
    decided_by: Marwane
    decided_on: "2026-11-18"
    decision_ref: *decision_84_20261118

  - id: referentiel_metier
    label: Référentiel ou donnée métier
    match: toute autre table
    proposed_retention_days: null
    after_retention: aucune
    rule: >-
      Pas de durée : la donnée vit tant que le métier s'en sert. Une table morte (ni écrite,
      ni lue, sans dépendance SQL ni code) devient candidate à l'archivage, par lot.
    status: décidé
    decided_by: Marwane
    decided_on: "2026-11-18"
    decision_ref: *decision_84_20261118

