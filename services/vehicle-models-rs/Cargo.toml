[package]
name = "vehicle-models-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
description = "Rust (DEV) pour GET /api/vehicles/brands/:brandId/models : lot 1 (calcul appelé par Node) et route complète (R2)"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
base64 = "0.23.1"
brotli = { version = "9.0.0", default-features = false, features = ["std"] }
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
hickory-resolver = { version = "0.26.3", default-features = false, features = ["tokio", "system-config"] }
httparse = "1.10.1"
httpdate = "1.0.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
ring = "0.17.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", default-features = false, features = ["std"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip", "preserve_order"] }
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "io-util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }
url = "2.5.8"

[profile.release]
codegen-units = 1
lto = "thin"
