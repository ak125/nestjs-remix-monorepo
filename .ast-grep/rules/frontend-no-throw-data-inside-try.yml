id: frontend-no-throw-data-inside-try
language: typescript
severity: warning
message: |
  `throw data(...)` levé DANS un `try` : `data()` renvoie un
  DataWithResponseInit, pas une `Response`. Un `catch` qui ne relance que
  `err instanceof Response` le rattrape et le remplace par sa réponse de
  repli — le statut décidé (401/403/404/410…) devient 500 ou 502.

  Lever une erreur de domaine dans le `try` et la traduire en `data()` dans
  le `catch` :

      class LeadApiStatusError extends Error {
        constructor(readonly status: number, message: string) { super(message); }
      }
      try {
        if (res.status === 404) throw new LeadApiStatusError(404, "…");
      } catch (err) {
        if (err instanceof Response) throw err;
        if (err instanceof LeadApiStatusError) {
          throw data({ error: err.message }, { status: err.status });
        }
        // repli
      }

  Voir :
    - frontend/app/routes/blog-pieces-auto.conseils.$pg_alias.tsx (R3GuideNotFoundError)
    - frontend/app/routes/admin.leads.$id.tsx (LeadApiStatusError)
    - frontend/tests/unit/admin-leads-loader-status.test.ts
files:
  - frontend/app/**/*.ts
rule:
  pattern: throw data($$$)
  inside:
    kind: statement_block
    inside:
      kind: try_statement
      has:
        kind: catch_clause
    stopBy: end
