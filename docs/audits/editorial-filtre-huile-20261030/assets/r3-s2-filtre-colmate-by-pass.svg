<text x="955" y="590" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#1e293b" text-anchor="middle">Le clapet de dérivation s’ouvre : l’huile</text><text x="955" y="620" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#1e293b" text-anchor="middle">continue d’alimenter le moteur,</text><text x="955" y="650" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#1e293b" text-anchor="middle">mais elle n’est plus filtrée.</text>
